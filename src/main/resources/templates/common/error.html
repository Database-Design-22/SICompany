<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('오류')}"></head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>

<main class="container py-4">
    <div class="alert alert-danger">
        <h1 class="h5 alert-heading">요청을 처리할 수 없습니다</h1>
        <p class="mb-0" th:text="${message}">오류 메시지</p>
        <p class="small mt-2 mb-0 font-monospace" th:if="${detail != null}" th:text="${detail}">상세</p>
    </div>
    <a class="btn btn-outline-secondary btn-sm" href="javascript:history.back()">이전 화면</a>
    <a class="btn btn-outline-primary btn-sm" th:href="@{/}">홈으로</a>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
