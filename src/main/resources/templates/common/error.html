<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('오류')}"></head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>

<main class="container">
    <div class="empty-state danger">
        <div class="icon"><i class="bi bi-exclamation-octagon"></i></div>
        <h1 class="h5">요청을 처리할 수 없습니다</h1>
        <p class="mb-2" th:text="${message}">오류 메시지</p>
        <p class="small text-secondary font-monospace mb-3" th:if="${detail != null}" th:text="${detail}">상세</p>
        <div class="d-flex justify-content-center gap-2 mt-3">
            <a class="btn btn-outline-secondary btn-sm" href="javascript:history.back()"><i class="bi bi-arrow-left"></i> 이전 화면</a>
            <a class="btn btn-primary btn-sm" th:href="@{/}"><i class="bi bi-house-door"></i> 홈으로</a>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
