<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('홈')}"></head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>

<main class="container py-4">

    <!-- 사용자를 고르지 않았을 때 -->
    <div th:if="${currentUser == null}">
        <h1 class="h3 mb-3">SI 프로젝트 인력·평가 관리 시스템</h1>
        <div class="alert alert-warning">
            화면 오른쪽 위에서 <strong>현재 사용자</strong>를 고르세요.
            고른 직원의 권한에 맞는 메뉴가 열립니다. (로그인을 대신합니다)
        </div>
        <ul class="text-secondary small">
            <li>개발직원: 내 프로젝트, 평가메모, 내 평가</li>
            <li>경영관리팀: 교체 요청, 발주처 지정인력, 인력 배정, 프로젝트 관리</li>
            <li>경영진: 평가 결과·보정, 프로젝트 현황, 직원 검색</li>
        </ul>
    </div>

    <!-- 사용자를 골랐을 때: 볼 수 있는 메뉴를 카드로 -->
    <div th:if="${currentUser != null}">
        <h1 class="h3 mb-1">
            <span th:text="${currentUser.empNm}">이름</span>님, 안녕하세요
        </h1>
        <p class="text-secondary mb-4">
            <span th:text="${currentUser.empId}">직원ID</span> ·
            <span th:text="${currentUser.empDiv}">개발</span>직원 ·
            <span th:text="${currentUser.authNm}">권한</span>
        </p>

        <div class="row g-4">
            <div class="col-md-6 col-xl-4" th:each="g : ${menuGroups}">
                <div class="card h-100">
                    <div class="card-header fw-semibold" th:text="${g.title}">메뉴 그룹</div>
                    <div class="list-group list-group-flush">
                        <a class="list-group-item list-group-item-action" th:each="m : ${g.items}"
                           th:href="@{${m.path}}">
                            <div class="fw-semibold" th:text="${m.title}">메뉴</div>
                            <div class="small text-secondary" th:text="${m.description}">설명</div>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: sql}"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
