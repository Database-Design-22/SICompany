<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<!-- 공통 head: <head th:replace="~{fragments/layout :: head('화면 제목')}"></head>
     모양은 static/css/app.css 한 곳에서 맞춘다. -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' - SI 인력·평가 관리'">SI 인력·평가 관리</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<!-- 공통 헤더: <div th:replace="~{fragments/layout :: header}"></div>
     위쪽 바(현재 사용자 고르기)와 왼쪽 메뉴를 함께 넣는다. 메뉴는 common/Menus.java -->
<th:block th:fragment="header">
<nav class="app-top navbar navbar-expand">
    <div class="container-fluid px-3 px-md-4 flex-wrap gap-2">
        <a class="app-brand me-3" th:href="@{/}">
            <span class="logo"><i class="bi bi-diagram-3"></i></span>
            <span>SI 인력·평가 관리<small>프로젝트 인력 배치와 평가</small></span>
        </a>

        <!-- 좁은 화면에서는 왼쪽 메뉴 대신 드롭다운 -->
        <ul class="navbar-nav me-auto d-md-none">
            <li class="nav-item dropdown" th:each="g : ${menuGroups}">
                <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                   th:text="${g.title}">메뉴 그룹</a>
                <ul class="dropdown-menu">
                    <li th:each="m : ${g.items}">
                        <a class="dropdown-item" th:href="@{${m.path}}" th:text="${m.title}">메뉴</a>
                    </li>
                </ul>
            </li>
        </ul>

        <div class="d-flex align-items-center gap-2 ms-md-auto">
            <form method="post" th:action="@{/current-user}" class="user-picker m-0 d-flex align-items-center gap-2">
                <input type="hidden" name="returnUrl" th:value="${currentPath}">
                <label for="current-user-select" class="small text-secondary text-nowrap">
                    <i class="bi bi-person-circle"></i> 현재 사용자
                </label>
                <select id="current-user-select" name="empId" class="form-select form-select-sm"
                        onchange="this.form.submit()">
                    <option value="" th:selected="${currentUser == null}">사용자를 고르세요</option>
                    <optgroup th:each="g : ${userGroups}" th:label="${g.key}">
                        <option th:each="u : ${g.value}"
                                th:value="${u.empId}"
                                th:selected="${currentUser != null and currentUser.empId == u.empId}"
                                th:text="|${u.empNm} (${u.empId})|">이름 (직원ID)</option>
                    </optgroup>
                </select>
            </form>
            <a class="btn btn-outline-secondary btn-sm text-nowrap" th:href="@{/signup}" th:if="${currentUser == null}">
                <i class="bi bi-person-plus"></i> 회원가입
            </a>
        </div>
    </div>
</nav>

<aside class="app-side d-none d-md-block">
    <div class="side-inner">
        <div class="side-user" th:if="${currentUser != null}">
            <span class="avatar" th:text="${#strings.substring(currentUser.empNm, 0, 1)}">김</span>
            <div class="min-w-0">
                <div class="name" th:text="${currentUser.empNm}">이름</div>
                <div class="meta" th:text="|${currentUser.empId} · ${currentUser.empDiv} · ${currentUser.authNm}|">직원ID</div>
            </div>
        </div>
        <div class="side-user" th:if="${currentUser == null}">
            <span class="avatar"><i class="bi bi-person"></i></span>
            <div class="meta">위쪽에서 사용자를 고르면 그 사람의 메뉴가 열립니다.</div>
        </div>

        <a class="side-link" th:href="@{/}" th:classappend="${currentPath == '/'} ? 'active'">
            <i class="bi bi-house-door"></i><span>홈</span>
        </a>
        <th:block th:each="g : ${sideMenu}">
            <div class="side-label" th:text="${g.title}">메뉴 그룹</div>
            <a th:each="m : ${g.items}" class="side-link" th:href="@{${m.path}}" th:title="${m.description}"
               th:classappend="${(m.active ? 'active ' : '') + (m.ready ? '' : 'not-ready')}">
                <i class="bi" th:classappend="${m.icon}"></i>
                <span th:text="${m.title}">메뉴</span>
                <span class="soon" th:unless="${m.ready}">준비 중</span>
            </a>
        </th:block>
    </div>
</aside>
</th:block>

<!-- 실행한 SQL: <div th:replace="~{fragments/layout :: sql}"></div>
     컨트롤러에서 model에 executedSqls(List<ExecutedSql>)를 넣으면 보인다. -->
<section th:fragment="sql" class="sql-panel container"
         th:if="${executedSqls != null and !executedSqls.isEmpty()}">
    <details>
        <summary>
            <i class="bi bi-database"></i>
            이 화면이 실행한 SQL
            <span class="badge text-bg-light border" th:text="|${executedSqls.size()}건|">0건</span>
            <i class="bi bi-chevron-down chev"></i>
        </summary>
        <div class="px-3 pb-3">
            <div th:each="s : ${executedSqls}" class="mt-3">
                <div class="sql-title" th:text="${s.title}">SQL 제목</div>
                <pre><code th:text="${s.sql}">SELECT ...</code></pre>
            </div>
        </div>
    </details>
</section>

<!-- 공통 스크립트: <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
     확인 창: 폼이나 제출 버튼에 data-confirm="물어볼 말"을 달면 제출 전에 화면 안 확인 창을 띄운다.
     (브라우저 기본 confirm()은 앱 내장 브라우저 등에서 바로 취소되는 경우가 있어 쓰지 않는다) -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <div class="modal fade" id="confirm-modal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title h5">확인</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
                </div>
                <div class="modal-body" id="confirm-message" style="white-space: pre-line">계속할까요?</div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="button" class="btn btn-primary" id="confirm-ok">확인</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        (() => {
            const modalEl = document.getElementById('confirm-modal');
            const modal = new bootstrap.Modal(modalEl);
            let pending = null;
            document.addEventListener('submit', (e) => {
                const form = e.target;
                const message = (e.submitter && e.submitter.dataset.confirm) || form.dataset.confirm;
                if (!message || form.dataset.confirmed === 'yes') {
                    return;
                }
                e.preventDefault();
                pending = { form, submitter: e.submitter };
                document.getElementById('confirm-message').textContent = message;
                modal.show();
            });
            document.getElementById('confirm-ok').addEventListener('click', () => {
                if (!pending) {
                    return;
                }
                const { form, submitter } = pending;
                pending = null;
                modal.hide();
                form.dataset.confirmed = 'yes';
                form.requestSubmit(submitter || undefined);
            });

            // 두 번 제출 막기: POST 폼을 한 번 제출하면 처리가 끝날 때까지 그 폼의 버튼을 잠근다.
            // (확인 창을 띄운 제출은 위에서 preventDefault 되므로 여기서 건너뛰고, 확인 후 다시 제출될 때 잠근다)
            document.addEventListener('submit', (e) => {
                const form = e.target;
                if (e.defaultPrevented || (form.getAttribute('method') || '').toLowerCase() !== 'post') {
                    return;
                }
                if (form.dataset.submitting === 'yes') {
                    e.preventDefault();
                    return;
                }
                form.dataset.submitting = 'yes';
                const submitter = e.submitter;
                // 누른 버튼의 name/value(예: action=save)는 제출 순간에 이미 담기므로, 잠금은 그 다음에 건다.
                setTimeout(() => {
                    const buttons = [...form.querySelectorAll('button[type=submit], button:not([type])')];
                    if (submitter && !buttons.includes(submitter)) {
                        buttons.push(submitter);
                    }
                    buttons.forEach((b) => {
                        b.disabled = true;
                        b.dataset.locked = 'yes';
                        if (b === submitter) {
                            b.dataset.originalText = b.textContent;
                            b.textContent = '처리 중…';
                        }
                    });
                }, 0);
            });

            // 뒤로 가기로 돌아온 화면(브라우저 캐시)은 입력한 내용은 그대로 두고 잠금만 푼다.
            window.addEventListener('pageshow', (e) => {
                if (!e.persisted) {
                    return;
                }
                document.querySelectorAll('form[data-submitting]').forEach((f) => delete f.dataset.submitting);
                document.querySelectorAll('[data-locked]').forEach((b) => {
                    b.disabled = false;
                    delete b.dataset.locked;
                    if (b.dataset.originalText) {
                        b.textContent = b.dataset.originalText;
                        delete b.dataset.originalText;
                    }
                });
            });
        })();
    </script>
</th:block>

</body>
</html>
