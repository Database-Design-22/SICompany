<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('특정 시점 참여 조회')}"></head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>

<main class="container py-4">
    <nav class="small text-secondary mb-1"><a th:href="@{/}">홈</a> / <a th:href="@{/employees}">직원 검색</a></nav>
    <h1 class="h3">특정 시점 참여 조회</h1>
    <p class="text-secondary">날짜를 고르면 그날 누가 어느 프로젝트에 어떤 직무로 투입되어 있었는지 보여 줍니다.</p>

    <form method="get" th:action="@{/employees/as-of}" class="d-flex align-items-center gap-2 mb-3">
        <input type="date" name="date" class="form-control form-control-sm w-auto" th:value="${date}" required>
        <button type="submit" class="btn btn-primary btn-sm">조회</button>
        <span class="small text-secondary" th:text="|${rows.size()}명 투입 중|">0명</span>
    </form>

    <div class="alert alert-light border" th:if="${rows.isEmpty()}">그날 투입 중인 직원이 없습니다.</div>
    <div class="table-responsive" th:unless="${rows.isEmpty()}">
        <table class="table table-sm align-middle">
            <thead class="table-light">
            <tr><th>프로젝트</th><th>발주처</th><th>직원</th><th>직무</th><th>투입 기간</th></tr>
            </thead>
            <tbody>
            <tr th:each="r, it : ${rows}">
                <td class="text-nowrap">
                    <th:block th:if="${it.first or rows[it.index - 1].prjId != r.prjId}">
                        <span class="fw-semibold" th:text="${r.prjNm}">프로젝트</span>
                        <span class="small text-secondary" th:text="${r.prjId}">ID</span>
                    </th:block>
                </td>
                <td class="small text-nowrap">
                    <span th:if="${it.first or rows[it.index - 1].prjId != r.prjId}" th:text="${r.clientNm}">발주처</span>
                </td>
                <td class="text-nowrap"><a th:href="@{/employees/{id}(id=${r.empId})}" th:text="${r.empNm}">이름</a></td>
                <td class="text-nowrap" th:text="${r.roleNm}">PM</td>
                <td class="small text-nowrap" th:text="|${r.strtDt} ~ ${r.endDt != null ? r.endDt : '투입 중'}|">기간</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<div th:replace="~{fragments/layout :: sql}"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
